<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>Self-healing: power states and recovery paths</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-weight="bold" font-size="15">Power states (by battery voltage, under no load) and recovery paths</text>

  <!-- BOOT -->
  <rect x="40" y="60" width="200" height="110" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="140" y="84" text-anchor="middle" font-weight="bold">BOOT</text>
  <text x="140" y="104" text-anchor="middle">log reset reason</text>
  <text x="140" y="122" text-anchor="middle">restore LoRaWAN session</text>
  <text x="140" y="140" text-anchor="middle">+ last fix from flash</text>
  <text x="140" y="158" text-anchor="middle">measure battery</text>

  <!-- states column -->
  <g>
    <rect x="330" y="60" width="270" height="80" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="465" y="84" text-anchor="middle" font-weight="bold">NORMAL   ≥ 3.70 V</text>
    <text x="465" y="104" text-anchor="middle">fix + uplink every 15 min when moving</text>
    <text x="465" y="122" text-anchor="middle">heartbeat every 6 h when parked</text>

    <rect x="330" y="180" width="270" height="80" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
    <text x="465" y="204" text-anchor="middle" font-weight="bold">SAVER   3.50 – 3.70 V</text>
    <text x="465" y="224" text-anchor="middle">fix every 60 min, BLE off</text>
    <text x="465" y="242" text-anchor="middle">GNSS timeout shortened to 60 s</text>

    <rect x="330" y="300" width="270" height="80" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
    <text x="465" y="324" text-anchor="middle" font-weight="bold">SURVIVAL   3.35 – 3.50 V</text>
    <text x="465" y="344" text-anchor="middle">GNSS off, status uplink every 6 h</text>
    <text x="465" y="362" text-anchor="middle">(battery + last known position)</text>

    <rect x="330" y="420" width="270" height="80" rx="8" fill="#ffebe9" stroke="#d1242f" stroke-width="1.5"/>
    <text x="465" y="444" text-anchor="middle" font-weight="bold">HIBERNATE   &lt; 3.35 V</text>
    <text x="465" y="464" text-anchor="middle">radio + sensors off, deep sleep</text>
    <text x="465" y="482" text-anchor="middle">wake hourly only to read voltage</text>
  </g>

  <!-- down transitions -->
  <g stroke="#1f2328" stroke-width="1.5" fill="none">
    <path d="M440,140 V178" marker-end="url(#a)"/>
    <path d="M440,260 V298" marker-end="url(#a)"/>
    <path d="M440,380 V418" marker-end="url(#a)"/>
    <path d="M490,178 V142" marker-end="url(#a)"/>
    <path d="M490,298 V262" marker-end="url(#a)"/>
    <path d="M490,418 V382" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="384" y="164">drops</text>
    <text x="498" y="164">≥ 3.80 V</text>
    <text x="384" y="284">drops</text>
    <text x="498" y="284">≥ 3.60 V</text>
    <text x="384" y="404">drops</text>
    <text x="498" y="404">≥ 3.60 V (solar)</text>
  </g>
  <text x="465" y="525" text-anchor="middle" fill="#57606a" font-size="12">Going up needs at least +0.1 V more than going down (hysteresis), so the device doesn't flap between states.</text>

  <path d="M240,110 H328" stroke="#1f2328" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="284" y="100" text-anchor="middle" font-size="11" fill="#57606a">pick state</text>

  <!-- SAFE MODE -->
  <rect x="40" y="250" width="200" height="120" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="140" y="274" text-anchor="middle" font-weight="bold">SAFE MODE</text>
  <text x="140" y="294" text-anchor="middle">≥ 3 resets within 1 h</text>
  <text x="140" y="312" text-anchor="middle">GNSS + BLE off,</text>
  <text x="140" y="330" text-anchor="middle">status uplink every 6 h</text>
  <text x="140" y="348" text-anchor="middle">exit after 24 h stable</text>
  <path d="M140,172 V248" stroke="#8250df" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="148" y="214" font-size="11" fill="#8250df">boot loop?</text>

  <!-- recovery column -->
  <rect x="660" y="60" width="270" height="440" rx="8" fill="#ffffff" stroke="#d1242f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="795" y="84" text-anchor="middle" font-weight="bold" fill="#d1242f">Recovery (any state)</text>

  <text x="676" y="116" font-weight="bold">Hardware watchdog, 60 s</text>
  <text x="676" y="134">hang or crash → reset → BOOT</text>

  <text x="676" y="172" font-weight="bold">Brown-out / empty battery</text>
  <text x="676" y="190">protection PCB cuts at ~3.0 V;</text>
  <text x="676" y="208">solar recharges → power-on → BOOT</text>

  <text x="676" y="246" font-weight="bold">GNSS timeout, 90 s</text>
  <text x="676" y="264">no fix → skip, keep schedule;</text>
  <text x="676" y="282">power-cycle GNSS after 3 misses</text>

  <text x="676" y="320" font-weight="bold">Network lost</text>
  <text x="676" y="338">LinkCheck fails for 24 h →</text>
  <text x="676" y="356">rejoin with backoff (1 h … 24 h)</text>

  <text x="676" y="394" font-weight="bold">Persisted in flash</text>
  <text x="676" y="412">session keys, frame counters,</text>
  <text x="676" y="430">DevNonce, last fix, reset count</text>

  <text x="676" y="468" font-weight="bold">Remote control (downlink)</text>
  <text x="676" y="486">interval, force rejoin, reboot</text>

  <path d="M795,58 C795,40 140,40 140,57" stroke="#d1242f" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
  <text x="806" y="53" fill="#d1242f" font-size="11">reset → BOOT</text>
</svg>
