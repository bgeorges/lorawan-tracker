<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>One tracking cycle: current over time (not to scale)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-weight="bold" font-size="15">One tracking cycle (every 15 min while moving) — time axis not to scale</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="920" y2="330" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="90" y1="330" x2="90" y2="50" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="920" y="352" text-anchor="end" fill="#57606a">time</text>
  <text x="30" y="60" fill="#57606a">current</text>

  <!-- y labels (log-like) -->
  <g fill="#57606a" font-size="12" text-anchor="end">
    <text x="82" y="314">50 µA</text>
    <text x="82" y="254">6 mA</text>
    <text x="82" y="164">30 mA</text>
    <text x="82" y="94">45 mA</text>
  </g>
  <g stroke="#d0d7de" stroke-dasharray="3 4">
    <line x1="90" y1="310" x2="900" y2="310"/>
    <line x1="90" y1="250" x2="900" y2="250"/>
    <line x1="90" y1="160" x2="900" y2="160"/>
    <line x1="90" y1="90" x2="900" y2="90"/>
  </g>

  <!-- current trace -->
  <path d="M90,310 H180 V250 H230 V160 H430 V250 H470 V90 H490 V250 H520 V310 H540 V250 H560 V310 H560 H900"
        fill="none" stroke="#0969da" stroke-width="2.5"/>
  <!-- cold-start extension -->
  <path d="M430,160 H640" fill="none" stroke="#d1242f" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="535" y="150" text-anchor="middle" fill="#d1242f" font-size="12">cold start: up to 45 s</text>

  <!-- phase labels -->
  <g font-size="12" text-anchor="middle">
    <text x="135" y="300">sleep</text>
    <text x="205" y="240">wake</text>
    <text x="330" y="150">GNSS fix</text>
    <text x="330" y="182" fill="#57606a">hot start ~1–10 s</text>
    <text x="450" y="240">build</text>
    <text x="480" y="80">TX</text>
    <text x="480" y="66" fill="#57606a">0.2 s (SF9)</text>
    <text x="540" y="240">RX1/RX2</text>
    <text x="730" y="300">sleep until next timer or motion interrupt</text>
  </g>

  <!-- trigger arrows -->
  <path d="M180,385 V340" stroke="#1a7f37" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="180" y="402" text-anchor="middle" fill="#1a7f37" font-size="12">timer or accelerometer INT</text>
  <path d="M430,385 V340" stroke="#9a6700" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="430" y="402" text-anchor="middle" fill="#9a6700" font-size="12">GNSS → backup mode (or off)</text>

  <!-- per-cycle energy -->
  <rect x="680" y="60" width="250" height="78" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="692" y="82" font-weight="bold">Charge per cycle</text>
  <text x="692" y="102">hot start: ~0.09 mAh</text>
  <text x="692" y="122" fill="#d1242f">cold start: ~0.38 mAh</text>
</svg>
