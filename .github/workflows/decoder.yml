name: decoder

on:
  push:
    paths: ['decoder/**', '.github/workflows/decoder.yml']
  pull_request:
    paths: ['decoder/**', '.github/workflows/decoder.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test decoder/*.test.js
